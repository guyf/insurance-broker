<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Broker Instructions — Denney Insurance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --surface2: #263348;
      --border:   #334155;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --teal:     #0d9488;
      --rose:     #f43f5e;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 16px 80px;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    header { margin-bottom: 28px; }
    header a { color: var(--muted); font-size: 0.8125rem; text-decoration: none; }
    header a:hover { color: var(--text); }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.02em; margin: 8px 0 4px; }
    header p { font-size: 0.875rem; color: var(--muted); line-height: 1.5; }

    .add {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      min-height: 64px;
      resize: vertical;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.875rem;
      line-height: 1.5;
    }
    textarea:focus { outline: none; border-color: var(--teal); }

    .row-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }

    button {
      font: inherit;
      font-size: 0.8125rem;
      font-weight: 500;
      border-radius: 7px;
      padding: 6px 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
    }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
    button.primary:hover:not(:disabled) { background: #0f766e; }
    button.danger:hover:not(:disabled) { border-color: var(--rose); color: var(--rose); }
    button.icon { padding: 4px 8px; color: var(--muted); }

    ol { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
    }
    li.disabled .text { color: var(--muted); text-decoration: line-through; }

    .item { display: flex; gap: 12px; align-items: flex-start; }
    .item input[type=checkbox] { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--teal); flex-shrink: 0; cursor: pointer; }
    .text { flex: 1; min-width: 0; font-size: 0.9rem; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 6px; }
    .controls { display: flex; gap: 4px; flex-shrink: 0; }

    .empty, .status { color: var(--muted); font-size: 0.875rem; text-align: center; padding: 28px 0; }
    .error { color: var(--rose); }

    @media (max-width: 520px) {
      .item { flex-wrap: wrap; }
      .controls { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a href="/admin">← Admin</a>
      <h1>Broker Instructions</h1>
      <p>Standing instructions added to the broker's prompt on every chat turn, for every business, in this order.
        Changes apply to the next message sent — no deploy needed.</p>
    </header>

    <form class="add" id="add-form">
      <textarea id="new-text" maxlength="2000" placeholder="e.g. Always conclude with a numbered list of recommended actions."></textarea>
      <div class="row-actions">
        <button type="submit" class="primary" id="add-btn">Add instruction</button>
      </div>
    </form>

    <div id="status" class="status">Loading…</div>
    <ol id="list"></ol>
  </div>

  <script>
    const API = "/admin/api/instructions";
    const listEl = document.getElementById("list");
    const statusEl = document.getElementById("status");
    let items = [];

    async function api(method, body) {
      const res = await fetch(API, {
        method,
        headers: body ? { "Content-Type": "application/json" } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
      return data;
    }

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = "status" + (isError ? " error" : "");
      statusEl.hidden = !text;
    }

    async function load() {
      try {
        items = await api("GET");
        setStatus(items.length ? "" : "No instructions yet — the broker is using its base prompt only.");
        render();
      } catch (err) {
        setStatus(err.message, true);
      }
    }

    function el(tag, props = {}, children = []) {
      const node = Object.assign(document.createElement(tag), props);
      for (const c of children) node.append(c);
      return node;
    }

    async function act(fn) {
      try {
        await fn();
        await load();
      } catch (err) {
        setStatus(err.message, true);
      }
    }

    function render() {
      listEl.replaceChildren(...items.map((item, i) => {
        const li = el("li", { className: item.enabled ? "" : "disabled" });

        const toggle = el("input", { type: "checkbox", checked: item.enabled, title: item.enabled ? "Enabled" : "Disabled" });
        toggle.addEventListener("change", () => act(() => api("PATCH", { id: item.id, enabled: toggle.checked })));

        const text = el("div", { className: "text", textContent: item.text });
        const meta = el("div", {
          className: "meta",
          textContent: `${item.created_by ?? "unknown"} · ${new Date(item.updated_at).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" })}`,
        });
        const body = el("div", { style: "flex:1;min-width:0" }, [text, meta]);

        const up = el("button", { className: "icon", textContent: "↑", title: "Move up", disabled: i === 0 });
        const down = el("button", { className: "icon", textContent: "↓", title: "Move down", disabled: i === items.length - 1 });
        up.addEventListener("click", () => swap(i, i - 1));
        down.addEventListener("click", () => swap(i, i + 1));

        const editBtn = el("button", { textContent: "Edit" });
        editBtn.addEventListener("click", () => startEdit(body, item));

        const del = el("button", { className: "danger", textContent: "Delete" });
        del.addEventListener("click", () => {
          if (confirm("Delete this instruction?")) act(() => api("DELETE", { id: item.id }));
        });

        li.append(el("div", { className: "item" }, [toggle, body, el("div", { className: "controls" }, [up, down, editBtn, del])]));
        return li;
      }));
    }

    function startEdit(body, item) {
      const area = el("textarea", { value: item.text, maxLength: 2000 });
      const save = el("button", { className: "primary", textContent: "Save" });
      const cancel = el("button", { textContent: "Cancel" });
      save.addEventListener("click", () => act(() => api("PATCH", { id: item.id, text: area.value })));
      cancel.addEventListener("click", render);
      body.replaceChildren(area, el("div", { className: "row-actions" }, [cancel, save]));
      area.focus();
    }

    // Renumber the whole list after a swap so sort values stay unique and contiguous
    function swap(a, b) {
      const reordered = [...items];
      [reordered[a], reordered[b]] = [reordered[b], reordered[a]];
      act(() => Promise.all(
        reordered.map((item, i) => item.sort === i + 1 ? null : api("PATCH", { id: item.id, sort: i + 1 })).filter(Boolean)
      ));
    }

    document.getElementById("add-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("new-text");
      const text = input.value.trim();
      if (!text) return;
      const btn = document.getElementById("add-btn");
      btn.disabled = true;
      act(async () => {
        await api("POST", { text });
        input.value = "";
      }).finally(() => { btn.disabled = false; });
    });

    load();
  </script>
</body>
</html>
