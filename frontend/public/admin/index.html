<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Denney Insurance</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0f172a;
      --surface:  #1e293b;
      --surface2: #263348;
      --border:   #334155;
      --text:     #e2e8f0;
      --muted:    #94a3b8;
      --teal:     #0d9488;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 40px 32px 80px;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 32px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.875rem;
      color: var(--muted);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-card {
      display: block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, background 0.15s;
    }

    .link-card:hover {
      border-color: var(--teal);
      background: var(--surface2);
    }

    .link-card h2 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .link-card p {
      font-size: 0.8125rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Admin</h1>
      <p>Internal tools — gated by Cloudflare Access.</p>
    </header>
    <div class="links">
      <a class="link-card" href="/admin/architecture">
        <h2>Architecture</h2>
        <p>Build status — what's live, in progress, and planned.</p>
      </a>
      <a class="link-card" href="/admin/market-policies">
        <h2>Market Policy Registry</h2>
        <p>Curated policy booklets from major UK personal lines insurers.</p>
      </a>
    </div>
  </div>
</body>
</html>
