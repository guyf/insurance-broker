name = "insurance-broker"
main = "worker/src/index.ts"
compatibility_date = "2024-11-05"

# Static SPA output – produced by `npm run build` (tsc + vite), served via
# env.ASSETS.fetch() in worker/src/index.ts for any path not matched by an
# /api/* route.
[assets]
directory = "./dist"
binding = "ASSETS"

# Runs on every git-connected deploy (Cloudflare Workers Builds).
[build]
command = "npm run build"

# Not secret — safe to commit (matches CLAUDE.md's existing note on
# SUPABASE_URL/SUPABASE_ANON_KEY). SUPABASE_SERVICE_ROLE_KEY is sensitive
# and must be set via `wrangler secret put SUPABASE_SERVICE_ROLE_KEY`.
[vars]
SUPABASE_URL = "https://qsnruquxukjkrbhyzsia.supabase.co"

# QuickBooks report/company API host and OpenID UserInfo host — sandbox and
# production use different hosts for both (auth/token endpoints are shared).
# Currently testing against sandbox; flip both to the production hosts
# (https://quickbooks.api.intuit.com and https://accounts.platform.intuit.com)
# when INTUIT_CLIENT_ID/SECRET are swapped back to production keys.
QUICKBOOKS_API_BASE = "https://sandbox-quickbooks.api.intuit.com"
QUICKBOOKS_ACCOUNTS_BASE = "https://sandbox-accounts.platform.intuit.com"
